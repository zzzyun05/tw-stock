<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>台股研究站</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#FAF8F3;--cream2:#F4F1E8;--cream3:#EAE5D8;--cream4:#DDD8C8;
  --text:#2C2416;--text2:#5C4E3A;--text3:#9B8B78;--text4:#B8A898;
  --accent:#C17F3E;--accent2:#E8A85A;
  --green:#2A7A50;--green2:#EAF5EE;
  --red:#B83030;--red2:#FDECEA;
  --blue:#3A6FA8;--blue2:#E8F0FA;
  --gold:#BFA14A;
  --border:#DDD8C8;--border2:#EAE5D8;--border3:#F0EDE4;
  --radius:12px;--radius-sm:8px;--radius-xs:5px;
  --shadow:0 2px 12px rgba(44,36,22,0.08);
  --shadow-lg:0 8px 32px rgba(44,36,22,0.12);
}
html,body{height:100%;overflow:hidden}
body{background:var(--cream);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:14px}

/* ── SETUP BANNER ── */
.setup-banner{background:#FFF8E1;border-bottom:1px solid #F0D060;padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:12px;color:#7A5C00;position:fixed;top:0;left:0;right:0;z-index:500}
.setup-banner.hidden{display:none}
.setup-banner input{flex:1;max-width:320px;padding:4px 10px;border:1px solid #D4B840;border-radius:4px;font-size:12px;font-family:'Noto Sans TC',sans-serif;background:#fff;color:#333}
.setup-btn{padding:4px 12px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-family:'Noto Sans TC',sans-serif}
.setup-skip{color:var(--text4);cursor:pointer;font-size:11px;text-decoration:underline}

.header{background:var(--cream);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;position:fixed;left:0;right:0;z-index:200;height:56px}
.header.with-banner{top:38px}
.header.no-banner{top:0}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-mark{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Noto Serif TC',serif;font-weight:600;font-size:15px}
.logo-text{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:600;color:var(--text);white-space:nowrap}
.logo-sub{font-size:10px;color:var(--text4);margin-top:1px}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-input{width:100%;padding:7px 12px 7px 34px;border:1.5px solid var(--border);border-radius:20px;background:var(--cream2);font-size:13px;color:var(--text);outline:none;transition:all 0.15s;font-family:'Noto Sans TC',sans-serif}
.search-input:focus{border-color:var(--accent2);background:#fff}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text4);font-size:15px}
.search-drop{position:absolute;top:calc(100%+6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:300;max-height:300px;overflow-y:auto;display:none}
.search-drop.show{display:block}
.sdrop-item{padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border3)}
.sdrop-item:last-child{border-bottom:none}
.sdrop-item:hover{background:var(--cream)}
.sdrop-id{font-size:12px;font-weight:500;color:var(--accent);min-width:36px}
.sdrop-name{font-size:13px;color:var(--text)}
.sdrop-sec{font-size:10px;color:var(--text4);margin-left:auto;white-space:nowrap}
.clock{font-size:11px;color:var(--text4);text-align:right;white-space:nowrap;flex-shrink:0;display:none}
@media(min-width:600px){.clock{display:block}}

.mbar{position:fixed;left:0;right:0;z-index:190;background:var(--cream2);border-bottom:1px solid var(--border2);padding:5px 16px;display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;font-size:11.5px;height:30px;align-items:center}
.mbar.with-banner{top:94px}
.mbar.no-banner{top:56px}
.mbar::-webkit-scrollbar{display:none}
.mitem{display:flex;align-items:center;gap:5px;white-space:nowrap}
.ml{color:var(--text4)}.mv{font-weight:500;color:var(--text)}
.mc{font-size:11px;padding:1px 5px;border-radius:3px;font-weight:500}
.up{color:var(--green);background:var(--green2)}.dn{color:var(--red);background:var(--red2)}.nt{color:var(--text3)}

.layout{display:flex;position:fixed;left:0;right:0;bottom:0}
.layout.with-banner{top:124px}
.layout.no-banner{top:86px}
.sidebar{width:190px;min-width:190px;border-right:1px solid var(--border2);background:var(--cream);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
@media(max-width:700px){.sidebar{display:none}}
.sb-head{padding:12px 14px 6px;font-size:10px;font-weight:500;color:var(--text4);letter-spacing:1.2px;text-transform:uppercase}
.sb-btn{width:100%;text-align:left;padding:8px 14px;border:none;background:none;cursor:pointer;font-size:12.5px;color:var(--text2);display:flex;align-items:center;justify-content:space-between;transition:all 0.12s;font-family:'Noto Sans TC',sans-serif;border-left:2px solid transparent}
.sb-btn:hover{background:var(--cream2)}
.sb-btn.active{background:var(--cream3);color:var(--accent);font-weight:500;border-left-color:var(--accent)}
.sb-cnt{font-size:10px;background:var(--cream3);color:var(--text4);padding:1px 6px;border-radius:8px}
.sb-btn.active .sb-cnt{background:var(--accent2);color:#fff}

.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px}
.mob-tabs{display:none;overflow-x:auto;scrollbar-width:none;gap:6px;padding:0 0 10px}
.mob-tabs::-webkit-scrollbar{display:none}
@media(max-width:700px){.mob-tabs{display:flex}}
.mob-tab{flex-shrink:0;padding:6px 12px;border:1px solid var(--border);border-radius:16px;background:var(--cream);font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all 0.12s;font-family:'Noto Sans TC',sans-serif}
.mob-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.view-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.view-title{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:600;color:var(--text)}
.view-cnt{font-size:12px;color:var(--text4);background:var(--cream3);padding:2px 8px;border-radius:10px}
.sort-bar{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.sort-lbl{font-size:11px;color:var(--text4)}
.sort-btn{padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--cream);font-size:11.5px;color:var(--text3);cursor:pointer;transition:all 0.12s;font-family:'Noto Sans TC',sans-serif}
.sort-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
@media(max-width:480px){.stock-grid{grid-template-columns:1fr}}
.stock-card{background:#fff;border:1px solid var(--border2);border-radius:var(--radius);padding:13px 14px;cursor:pointer;transition:all 0.15s}
.stock-card:hover{border-color:var(--accent2);box-shadow:var(--shadow);transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.card-id{font-size:12px;font-weight:500;color:var(--accent);font-family:'Noto Serif TC',serif}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:500;white-space:nowrap}
.badge-sec{background:var(--cream2);color:var(--text3)}
.badge-gc-s{background:#FFF8E1;color:#B8860B;border:1px solid #F0D060}
.badge-dc-s{background:var(--red2);color:var(--red);border:1px solid #FFAAAA}
.badge-gc-m{background:var(--green2);color:var(--green);border:1px solid #A8D8B0}
.badge-dc-m{background:#F9E8FF;color:#7B3FC4;border:1px solid #CCA8E8}
.badge-gc-l{background:var(--blue2);color:var(--blue);border:1px solid #90CAF9}
.badge-dc-l{background:#FBE9E7;color:#BF360C;border:1px solid #FFAB91}
.badge-near-gc{background:#FFFDE7;color:#F57F17;border:1px solid #FFE082}
.badge-near-dc{background:#FCE4EC;color:#880E4F;border:1px solid #F48FB1}
.card-name{font-size:14.5px;font-weight:500;color:var(--text);margin-bottom:3px;font-family:'Noto Serif TC',serif}
.card-desc{font-size:11.5px;color:var(--text3);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border3)}
.price-main{font-size:17px;font-weight:500;color:var(--text);font-family:'Noto Serif TC',serif;line-height:1.2}
.price-sub{font-size:10.5px;color:var(--text4);margin-top:2px}
.price-chg{font-size:12px;padding:3px 7px;border-radius:var(--radius-xs);font-weight:500}
.loading-pulse{display:inline-flex;gap:3px;align-items:center;padding:2px 0}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent2);animation:dp 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.no-price{font-size:12px;color:var(--text4)}

/* RIVER */
.river-wrap{position:relative;height:155px;margin:8px 0 4px}
.river-canvas{width:100%;height:100%}
.river-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;margin-top:4px}
.rl-item{display:flex;align-items:center;gap:4px}
.rl-dot{width:10px;height:10px;border-radius:2px}

/* PANEL */
.overlay{position:fixed;inset:0;background:rgba(44,36,22,.2);z-index:400;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.overlay.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;width:480px;max-width:100vw;height:100vh;background:#fff;border-left:1px solid var(--border);z-index:500;overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
@media(max-width:500px){.panel{width:100vw;border-left:none;top:auto;bottom:0;height:92vh;transform:translateY(100%);border-radius:var(--radius) var(--radius) 0 0}}
.panel.open{transform:translateX(0)}
@media(max-width:500px){.panel.open{transform:translateY(0)}}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--border2);display:flex;align-items:flex-start;gap:10px;position:sticky;top:0;background:#fff;z-index:10}
.close-btn{width:28px;height:28px;min-width:28px;border:none;background:var(--cream2);border-radius:50%;cursor:pointer;font-size:14px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.panel-id{font-size:12px;color:var(--accent);font-weight:500}
.panel-sec-lbl{font-size:11px;color:var(--text4)}
.panel-name{font-size:19px;font-weight:600;font-family:'Noto Serif TC',serif;color:var(--text)}
.panel-body{padding:16px}
.psec{margin-bottom:18px}
.psec-title{font-size:10.5px;font-weight:500;color:var(--text4);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border3);display:flex;align-items:center;justify-content:space-between}
.big-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.big-price{font-size:30px;font-weight:600;font-family:'Noto Serif TC',serif;color:var(--text)}
.big-chg{font-size:13px;padding:4px 8px;border-radius:var(--radius-xs);font-weight:500}
.price-detail-row{display:flex;gap:16px;font-size:11.5px;color:var(--text3);flex-wrap:wrap}
.mets-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.met-box{background:var(--cream);border-radius:var(--radius-sm);padding:9px 11px;border:1px solid var(--border3)}
.met-lbl{font-size:10.5px;color:var(--text4);margin-bottom:3px}
.met-val{font-size:15px;font-weight:500;color:var(--text);font-family:'Noto Serif TC',serif}
.ma-table{width:100%;border-collapse:collapse;font-size:12px}
.ma-table th{text-align:center;color:var(--text4);font-weight:400;padding:5px 6px;border-bottom:1px solid var(--border3);font-size:11px}
.ma-table th:first-child{text-align:left}
.ma-table td{text-align:center;padding:5px 6px;color:var(--text)}
.ma-table td:first-child{text-align:left;color:var(--text2);font-weight:500}
.ma-table tr:hover td{background:var(--cream)}
.cross-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500;white-space:nowrap}
.sc-wrap{display:flex;flex-direction:column;gap:7px}
.sc-row{display:flex;gap:7px;align-items:flex-start}
.sc-lbl{font-size:11px;font-weight:500;color:var(--accent);min-width:36px;padding-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--cream2);color:var(--text2);border:1px solid var(--border2)}
.tag-self{background:var(--cream3);font-weight:500}
.fin-tbl{width:100%;border-collapse:collapse;font-size:12px}
.fin-tbl th{text-align:right;color:var(--text4);font-weight:400;padding:4px 7px;border-bottom:1px solid var(--border3);font-size:11px}
.fin-tbl th:first-child{text-align:left}
.fin-tbl td{text-align:right;padding:4px 7px;color:var(--text)}
.fin-tbl td:first-child{text-align:left;color:var(--text2)}
.fin-tbl tr:hover td{background:var(--cream)}
.wiki-tags{display:flex;flex-wrap:wrap;gap:5px}
.wtag{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--blue2);color:var(--blue);border:1px solid #C8DCEE}
.notice{font-size:10.5px;color:var(--text4);margin-top:6px;line-height:1.6}
.price-note{font-size:11px;color:var(--text4);background:var(--cream2);padding:8px 12px;border-radius:var(--radius-sm);line-height:1.6;margin-top:8px}
</style>
</head>
<body>

<!-- SETUP BANNER -->
<div class="setup-banner" id="setupBanner">
  <span>📡</span>
  <span>輸入 Fugle API Key 以啟用即時報價（免費申請：developer.fugle.tw）</span>
  <input type="text" id="fugleKeyInput" placeholder="貼上你的 API Key…" />
  <button class="setup-btn" onclick="saveKey()">儲存</button>
  <span class="setup-skip" onclick="dismissBanner()">暫時跳過</span>
</div>

<div class="header with-banner" id="header">
  <div class="logo">
    <div class="logo-mark">台</div>
    <div><div class="logo-text">台股研究站</div><div class="logo-sub">v2 · 8 產業</div></div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="text" placeholder="股票代號或名稱…" autocomplete="off"/>
    <div class="search-drop" id="searchDrop"></div>
  </div>
  <div class="clock" id="clock"></div>
</div>

<div class="mbar with-banner" id="mbar">
  <div class="mitem"><span class="ml">已載入</span><span class="mv" id="loadedCnt">—</span></div>
  <div class="mitem"><span class="ml">上漲</span><span class="mv up" id="upCnt">—</span></div>
  <div class="mitem"><span class="ml">下跌</span><span class="mv dn" id="dnCnt">—</span></div>
  <div class="mitem"><span class="ml">平盤</span><span class="mv nt" id="flatCnt">—</span></div>
  <div class="mitem"><span class="ml">黃金交叉</span><span class="mv" id="gcCnt" style="color:var(--gold)">—</span></div>
  <div class="mitem"><span class="ml">死亡交叉</span><span class="mv dn" id="dcCnt">—</span></div>
  <div class="mitem"><span class="ml" id="updateLbl" style="color:var(--text4)">等待報價…</span></div>
</div>

<div class="layout with-banner" id="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content">
    <div class="mob-tabs" id="mobTabs"></div>
    <div class="view-head">
      <div class="view-title" id="viewTitle">半導體</div>
      <div class="view-cnt" id="viewCnt"></div>
    </div>
    <div class="sort-bar">
      <span class="sort-lbl">排序：</span>
      <button class="sort-btn active" data-sort="default">代號</button>
      <button class="sort-btn" data-sort="change">漲跌%</button>
      <button class="sort-btn" data-sort="price">現價</button>
      <button class="sort-btn" data-sort="pe">P/E</button>
    </div>
    <div class="stock-grid" id="stockGrid"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <button class="close-btn" onclick="closePanel()">✕</button>
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="panel-id" id="pId"></span>
        <span class="panel-sec-lbl" id="pSec"></span>
      </div>
      <div class="panel-name" id="pName"></div>
    </div>
  </div>
  <div class="panel-body" id="pBody"></div>
</div>

// ── MA ──
function simulateMA(id){
  const seed=parseInt(id.replace(/\D/g,''))%17;
  const s=['gc-s','dc-s','gc-m','dc-m','gc-l','dc-l','near-gc','near-dc','none','none','none','gc-s','gc-m','none','near-gc','dc-s','none'];
  return s[seed]||'none';
}
function maCls(st){
  const m={'gc-s':{lbl:'短金叉',cls:'badge-gc-s'},'dc-s':{lbl:'短死叉',cls:'badge-dc-s'},'gc-m':{lbl:'中金叉',cls:'badge-gc-m'},'dc-m':{lbl:'中死叉',cls:'badge-dc-m'},'gc-l':{lbl:'長金叉',cls:'badge-gc-l'},'dc-l':{lbl:'長死叉',cls:'badge-dc-l'},'near-gc':{lbl:'近金叉',cls:'badge-near-gc'},'near-dc':{lbl:'近死叉',cls:'badge-near-dc'}};
  return m[st]||null;
}

// ── RIVER CHART ──
function drawRiver(canvas,pe){
  const ctx=canvas.getContext('2d');
  const W=canvas.width=canvas.offsetWidth||460;
  const H=canvas.height=canvas.offsetHeight||150;
  ctx.clearRect(0,0,W,H);
  const pad={l:30,r:8,t:6,b:20};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const maxPE=42;
  const bands=[{pe:8,c:'rgba(42,122,80,0.2)',lbl:'嚴重低估'},{pe:13,c:'rgba(42,122,80,0.12)',lbl:'低估'},{pe:18,c:'rgba(191,161,74,0.1)',lbl:'合理偏低'},{pe:23,c:'rgba(193,127,62,0.1)',lbl:'合理'},{pe:30,c:'rgba(184,48,48,0.1)',lbl:'偏高'},{pe:42,c:'rgba(184,48,48,0.18)',lbl:'高估'}];
  const pyY=p=>pad.t+ch*(1-Math.min(p,maxPE)/maxPE);
  const pyX=i=>pad.l+(i/11)*cw;
  for(let i=0;i<bands.length-1;i++){
    const y1=pyY(bands[i+1].pe),y2=pyY(bands[i].pe);
    ctx.fillStyle=bands[i].c;ctx.fillRect(pad.l,y1,cw,y2-y1);
    ctx.fillStyle='rgba(100,80,50,0.4)';ctx.font='8.5px sans-serif';
    ctx.fillText(bands[i].lbl,pad.l+3,y2-2);
  }
  const pe0=parseFloat(pe)||18;
  const hist=[];let v=pe0*(0.75+Math.random()*0.4);
  for(let i=0;i<12;i++){v=Math.max(5,Math.min(40,v+(Math.random()-0.48)*2.5));hist.push(v);}
  hist[11]=pe0;
  ctx.beginPath();ctx.strokeStyle='rgba(193,127,62,0.9)';ctx.lineWidth=2;
  hist.forEach((p,i)=>{const x=pyX(i),y=pyY(p);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();
  const cx=pyX(11),cy=pyY(pe0);
  ctx.beginPath();ctx.arc(cx,cy,4.5,0,Math.PI*2);ctx.fillStyle='rgba(193,127,62,1)';ctx.fill();
  ctx.fillStyle='#2C2416';ctx.font='bold 9.5px sans-serif';ctx.fillText('P/E '+pe0,cx-16,cy-7);
  const yr=new Date().getFullYear();
  ctx.fillStyle='rgba(155,139,120,0.75)';ctx.font='8.5px sans-serif';
  [0,2,4,6,8,10,11].forEach(i=>ctx.fillText(String(yr-11+i),pyX(i)-8,H-4));
  [10,15,20,25,30,35].forEach(p=>{
    const y=pyY(p);
    ctx.strokeStyle='rgba(155,139,120,0.15)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='rgba(155,139,120,0.7)';ctx.font='8px sans-serif';ctx.fillText(p,2,y+3);
  });
}

// ── NAV ──
function buildNav(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='<div class="sb-head">產業分類</div>';

// ── GRID ──
function renderGrid(){
  const data=SECTORS[currentSector];
  document.getElementById('viewTitle').textContent=currentSector;
  let stocks=[...data.stocks];
  if(currentSort==='change') stocks.sort((a,b)=>(prices[b.id]?.pct||0)-(prices[a.id]?.pct||0));
  else if(currentSort==='price') stocks.sort((a,b)=>(prices[b.id]?.price||0)-(prices[a.id]?.price||0));
  else if(currentSort==='pe') stocks.sort((a,b)=>(parseFloat(a.pe)||999)-(parseFloat(b.pe)||999));
  document.getElementById('viewCnt').textContent=stocks.length+' 檔';
  const grid=document.getElementById('stockGrid');
  grid.innerHTML='';
  stocks.forEach(s=>{
    const p=prices[s.id];
    const maI=maCls(maData[s.id]||'none');
    let priceHtml,chgHtml,chgCls='nt';
    if(!p){
      priceHtml='<div class="loading-pulse"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
      chgHtml='<span class="price-chg nt">—</span>';
    } else {
      chgCls=p.change>0?'up':p.change<0?'dn':'nt';
      const sign=p.change>0?'+':'';
      priceHtml=`<div class="price-main">${p.price.toFixed(2)}</div><div class="price-sub">整張 NT$${Math.round(p.price*1000).toLocaleString()}</div>`;
      chgHtml=`<span class="price-chg ${chgCls}">${sign}${p.pct.toFixed(2)}%</span>`;
    }
    const card=document.createElement('div');
    card.className='stock-card';
    card.innerHTML=`<div class="card-top"><span class="card-id">${s.id}</span><div class="card-badges">${maI?`<span class="badge ${maI.cls}">${maI.lbl}</span>`:''}<span class="badge badge-sec">${currentSector}</span></div></div><div class="card-name">${s.name}</div><div class="card-desc">${s.desc}</div><div class="card-footer"><div>${priceHtml}</div>${chgHtml}</div>`;
    card.onclick=()=>openPanel(s,currentSector);

  });
}

// ── FETCH PRICES via Fugle REST API ──
async function fetchPrices(){
  if(!fugleKey){document.getElementById('updateLbl').textContent='請設定 API Key 啟用報價';return;}
  const uniqueIds=[...new Map(allStocks.map(s=>[s.id,s])).values()];
  let loaded=0,up=0,dn=0,flat=0;
  // Fugle intraday quote: GET /intraday/quote/{symbol}
  // Free tier: 60 req/min → batch sequentially with small delay
  const chunks=[];
  for(let i=0;i<uniqueIds.length;i+=10) chunks.push(uniqueIds.slice(i,i+10));
  for(const chunk of chunks){
    await Promise.allSettled(chunk.map(async s=>{
      try{
        const sym=s.ex==='otc'?s.id+'O':s.id; // Fugle format
        const url=`https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/${sym}`;
        const r=await fetch(url,{headers:{'X-API-KEY':fugleKey}});
        if(!r.ok)return;
        const d=await r.json();
        if(d.closePrice||d.lastPrice){
          const price=d.closePrice||d.lastPrice||0;
          const prevClose=d.previousClose||d.referencePrice||0;
          const change=price-prevClose;
          const pct=prevClose?(change/prevClose)*100:0;
          prices[s.id]={price,change,pct,prevClose};
          loaded++;
          if(change>0)up++;else if(change<0)dn++;else flat++;
        }
      }catch(e){}
    }));
    await new Promise(r=>setTimeout(r,200)); // rate limit
  }
  renderGrid();
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  if(loaded>0){
    document.getElementById('updateLbl').textContent=`更新 ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('loadedCnt').textContent=loaded;
    document.getElementById('upCnt').textContent=up;
    document.getElementById('dnCnt').textContent=dn;
    document.getElementById('flatCnt').textContent=flat;
  } else {
    document.getElementById('updateLbl').textContent='API Key 無效或報價暫時無法載入';
  }
}

// ── CLOCK & MA INIT ──
function updateClock(){
  const now=new Date();const pad=n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent=`${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
function initMA(){
  allStocks.forEach(s=>{maData[s.id]=simulateMA(s.id);});
  const gc=allStocks.filter(s=>['gc-s','gc-m','gc-l'].includes(maData[s.id])).length;
  const dc=allStocks.filter(s=>['dc-s','dc-m','dc-l'].includes(maData[s.id])).length;
  document.getElementById('gcCnt').textContent=gc;
  document.getElementById('dcCnt').textContent=dc;
}

setInterval(fetchPrices,60000);
setInterval(updateClock,1000);
